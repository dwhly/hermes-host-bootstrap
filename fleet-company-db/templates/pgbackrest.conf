# Managed by fleet-company-db. Secrets live in conf.d/50-secrets.conf (root:postgres 0640).
[global]
repo1-type=s3
repo1-s3-endpoint=@@S3_ENDPOINT@@
repo1-storage-port=@@S3_PORT@@
repo1-s3-bucket=@@S3_BUCKET@@
repo1-s3-region=@@S3_REGION@@
repo1-s3-uri-style=path
@@S3_CA_LINE@@
repo1-path=@@REPO_PATH@@
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=@@RETENTION_FULL_DAYS@@
# Nothing is deleted in this round (Dan's standing rule): backups and WAL are never expired
# automatically. Retention above takes effect only when this is turned on by a reviewed change.
expire-auto=n
repo1-bundle=y
compress-type=zst
archive-async=y
archive-copy=y
spool-path=/var/spool/pgbackrest
process-max=1
start-fast=y
log-level-console=warn
log-level-file=info
log-path=/var/log/pgbackrest

[@@STANZA@@]
pg1-path=/var/lib/postgresql/16/main

# ── hermes-host-bootstrap tmux.conf ──
# Sensible defaults that match what Hermes uses to spawn sub-agents.

# Use Ctrl-a as prefix (closer to home row than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse on, scrollback 50k lines
set -g mouse on
set -g history-limit 50000

# Vi-mode in copy/scroll buffers
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Renumber windows when one is closed
set -g renumber-windows on

# Start window/pane numbering at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Reload config with prefix-r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Easier pane splits (with awareness of current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Faster escape (default 500ms breaks vim)
set -sg escape-time 10

# True colour + italic support (assumes a modern terminal: Ghostty, Kitty, Alacritty, WezTerm, iTerm2)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Status bar: minimal, dark
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour39,bold] #S "
set -g status-right "#[fg=colour245] %Y-%m-%d %H:%M "
set -g window-status-current-style "fg=colour39,bold"

# ── hermes-host-bootstrap tmux-workspace-colors.conf ──
# Sourced from ~/.tmux.conf via a `source-file` line. Safe to re-source.
#
# Per-session colored statusline so the four workspace panes in
# hermes-workspace are visually distinguishable. The Ghostty pane all
# look identical (same near-black background, white text, yellow cursor)
# but the tmux statusbar at the bottom of each pane is colored according
# to the session name. Plus a colored session-name label on the left,
# big and obvious.
#
# Mapping (matches docs in skills/devops/tmux-workspace-pattern):
#   ops      red    — alerts / production / operations
#   code     cyan   — default work
#   logs     green  — info / streams
#   scratch  yellow — transient / experiments
#   * (any)  white  — generic fallback for ad-hoc hssh sessions
#
# The styles use 256-color codes for portability across terminals
# regardless of TERM. Colors chosen to be high-contrast on the
# near-black Ghostty background we configure.

# A status line layout that emphasises the session name. The session
# name appears huge on the left (bold, reverse-video block of color),
# and the date/host appear on the right in a subdued grey.
set -g status-style "bg=default,fg=colour245"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

# We update status-left to a full-bleed session label that picks a color
# based on the session name. The hook fires every time the client
# attaches or the session is switched, so the color follows the user.
#
# status-left format string uses tmux's #{?:,} ternary syntax to choose
# the color per session name. Falls back to white for unknown names.
set -g status-left ' #{?#{==:#S,ops},#[bg=colour160#,fg=colour231#,bold] ★ OPS  ,#{?#{==:#S,code},#[bg=colour33#,fg=colour231#,bold] ⌘ CODE ,#{?#{==:#S,logs},#[bg=colour34#,fg=colour231#,bold] ≡ LOGS ,#{?#{==:#S,scratch},#[bg=colour220#,fg=colour16#,bold] ✎ SCRATCH ,#[bg=colour240#,fg=colour231#,bold] #S }}}} #[default] '

# Right side: hostname + clock, subdued.
set -g status-right '#[fg=colour245]#H · %a %b %d · %H:%M '

# Current window highlight uses the session color via the same ternary
# so the active window indicator matches the session theme.
set -g window-status-current-style 'fg=#{?#{==:#S,ops},colour203,#{?#{==:#S,code},colour39,#{?#{==:#S,logs},colour77,#{?#{==:#S,scratch},colour220,colour231}}}},bold'

# Pane borders also get a subtle tint so the active pane is clearly
# delineated against the inactive ones. Stays muted to avoid visual noise.
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=#{?#{==:#S,ops},colour203,#{?#{==:#S,code},colour39,#{?#{==:#S,logs},colour77,#{?#{==:#S,scratch},colour220,colour245}}}}'
